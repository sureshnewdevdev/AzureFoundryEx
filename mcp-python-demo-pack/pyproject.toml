[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-python-demo-pack"
version = "1.0.0"
description = "Classroom-ready Model Context Protocol demonstrations using Python"
requires-python = ">=3.10"
dependencies = ["mcp[cli]>=2,<3", "pydantic>=2.7,<3", "httpx2>=2.12,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
